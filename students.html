<!DOCTYPE html>
<html lang="km">

		<meta charset="UTF-8" />

		<title>ព័ត៌មានសិស្ស</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 1rem;
			}

			.table-container {
				overflow-x: auto;
			}

			table {
				border-collapse: collapse;
				min-width: 100%;
				white-space: nowrap;
			}

			th,
			td {
				border: 1px solid #777;
				padding: 0.35rem;
				text-align: center;
			}

			thead th {
				background: #f1f1f1;
			}

			#student-search {
				margin-bottom: 0.75rem;
				padding: 0.4rem;
			}
		</style>
	</head>
	<body>
		<label for="student-search">ស្វែងរកសិស្ស៖</label>
		<input
			id="student-search"
			type="search"
			placeholder="ស្វែងរកតាមព័ត៌មានក្នុងតារាង"
		/>

					<tr id="column-header"></tr>

					"ប៊ុនទុង",

					"",
					"",
					"",
					"",
					"",
				],
			];

			const groupHeader = document.getElementById("group-header");
			const columnHeader = document.getElementById("column-header");
			const studentRows = document.getElementById("student-rows");

			for (const group of groups) {
				const th = document.createElement("th");
				th.colSpan = group.columns.length;
				th.textContent = group.title;
				groupHeader.appendChild(th);

				for (const label of group.columns) {
					const columnTh = document.createElement("th");
					columnTh.textContent = label;
					columnHeader.appendChild(columnTh);
				}
			}

			for (const student of students) {
				const row = document.createElement("tr");

				for (const value of student) {
					const cell = document.createElement("td");
					cell.textContent = value;
					row.appendChild(cell);
				}

				studentRows.appendChild(row);
			}

			// Filter rows as the user types.
			document
				.getElementById("student-search")
				.addEventListener("input", (event) => {
					const query = event.target.value.trim().toLocaleLowerCase();

					for (const row of studentRows.rows) {
						row.hidden = !row.textContent
							.toLocaleLowerCase()
							.includes(query);
					}
				});
		</script>
	</body>
</html>
